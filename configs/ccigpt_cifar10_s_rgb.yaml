exp_name: "ccigpt_cifar10_s_rgb"

# CC-iGPT RGB-bit-exact channel-first（消融起点 / 失败信号）
# 旧切片实测 50ep + SWA = 3.2540 bpd，B1 切片下不重训。
# 作论文 §x"为什么需要 sub-pixel AR"的失败信号脚注保留。

model:
  type: ccigpt
  image_size: 32
  in_channels: 3
  vocab_size: 256
  pool_factor: 4

  d_model: 512
  N: 24
  h: 8
  d_ff: 1376
  dropout: 0.0

  coarse_d_model: 256
  coarse_N: 6
  coarse_h: 4
  coarse_d_ff: 688

  activation_checkpointing: true

data:
  dataset: "cifar10"
  train: datasets/
  valid: datasets/
  num_workers: 8

train:
  amp_dtype: "bf16"
  batch_size: 64
  grad_accum_steps: 2
  lr: 3e-4
  eps: 1e-8
  epochs: 50
  log_freq: 50
  clip_max_norm: 1.0
  z_loss_weight: 1e-4
  lr_schedule: "cosine"
  warmup_epochs: 3
  swa:
    enabled: true
    start_epoch: 45
    update_interval: 1

eval:
  interval: 2

checkpoint:
  save_interval: 5
