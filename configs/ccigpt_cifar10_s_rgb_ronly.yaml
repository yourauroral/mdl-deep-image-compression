exp_name: "ccigpt_cifar10_s_rgb_ronly"

# CC-iGPT RGB-bit-exact + sub-pixel AR + R-only coarse（灰度先验）
#
# 设计动机：
#   coarse 只压 R 单通道 8×8（64 tokens, ~2% overhead），
#   coarse 不再背"3 通道相关"重担，容量解放给"R 通道空间结构"。fine 通过
#   sub-pixel AR 自学 G/B 相对 R 的偏色修正。
#
# ctx 注入策略：R 复制三份的"灰度先验"
#   coarse 输出 64 R token → bilinear UP 到 (B,1,32,32) → expand 到 (B,3,32,32)
#   → fine.token_embed 查表。bit-exact 严格保留，零新参数（仅 ctx_alpha 标量）。
#
# 本次重训配置：100ep + hflip 数据增强 + EMA (decay=0.999)，目标突破 3.10。

model:
  type: ccigpt
  image_size: 32
  in_channels: 3
  vocab_size: 256
  pool_factor: 4

  # fine 模型（与 iGPT-S 一致，~76M 参数）
  d_model: 512
  N: 24
  h: 8
  d_ff: 1376
  dropout: 0.0

  # coarse 模型（小且浅）
  coarse_d_model: 256
  coarse_N: 6
  coarse_h: 4
  coarse_d_ff: 688

  use_subpixel_ar: true         # pixel-first AR (coarse + fine 同步开启)
  coarse_in_channels: 1         # ★ R-only coarse；fine 仍 RGB 三通道
  activation_checkpointing: true

data:
  dataset: "cifar10"
  train: datasets/
  valid: datasets/
  num_workers: 8
  augment:
    hflip: true                 # RandomHorizontalFlip(p=0.5)，仅训练集

train:
  amp_dtype: "bf16"
  batch_size: 64
  grad_accum_steps: 2
  lr: 3e-4
  eps: 1e-8
  epochs: 100
  log_freq: 50
  clip_max_norm: 1.0
  z_loss_weight: 1e-4
  lr_schedule: "cosine"
  warmup_epochs: 3
  swa:
    enabled: true
    start_epoch: 90
    update_interval: 1
  ema:
    enabled: true
    decay: 0.999               # 近 ~1000 step 主导，平滑训练末段抖动

eval:
  interval: 2

checkpoint:
  save_interval: 5
