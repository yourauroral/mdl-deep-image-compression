exp_name: "ccigpt_cifar10_s_rgb_ronly"

# CC-iGPT RGB-bit-exact + sub-pixel AR + R-only coarse（灰度先验）
#
# ⚠️ v1 历史主表配置（已被 v2 替代）— 实测 best+TTA 2.9035 ± 0.0854 bpd（100ep）。
#    当前主表请使用 ccigpt_cifar10_s_rgb_ronly_v2.yaml（深窄 N=32/d=448 + 200ep
#    + ensemble，主表 2.8296 bpd）。本配置保留作 v1→v2 提升对照参考。
#
# 设计动机：
#   coarse 只压 R 单通道 8×8（64 tokens, ~2% overhead），
#   coarse 不再背"3 通道相关"重担，容量解放给"R 通道空间结构"。fine 通过
#   sub-pixel AR 自学 G/B 相对 R 的偏色修正。
#
# ctx 注入策略：R 复制三份的"灰度先验"
#   coarse 输出 64 R token → bilinear UP 到 (B,1,32,32) → expand 到 (B,3,32,32)
#   → fine.token_embed 查表。bit-exact 严格保留，零新参数（仅 ctx_alpha 标量）。
#
# v1 训练配置：100ep + hflip + RandomCrop(reflect) + dropout 0.1 +
# DropPath 0→0.1 + EMA(decay=0.9995) + SWA(last 10ep)。
# v1 实测：单 forward bpd 2.9038；+TTA hflip → 2.9035（v1 历史主表）。

model:
  type: ccigpt
  image_size: 32
  in_channels: 3
  vocab_size: 256
  pool_factor: 4

  # fine 模型（与 iGPT-S 一致，~76M 参数）
  d_model: 512
  N: 24
  h: 8
  d_ff: 1376
  dropout: 0.1                  # 0.0 → 0.1，对抗 100ep 长训过拟合
  drop_path: 0.1                # Stochastic Depth 线性 0 → 0.1（仅作用于 fine）

  # coarse 模型（小且浅）
  coarse_d_model: 256
  coarse_N: 6
  coarse_h: 4
  coarse_d_ff: 688

  coarse_in_channels: 1         # ★ R-only coarse；fine 仍 RGB 三通道
  activation_checkpointing: true

data:
  dataset: "cifar10"
  train: datasets/
  valid: datasets/
  num_workers: 8
  augment:
    hflip: true                 # RandomHorizontalFlip(p=0.5)
    random_crop:                # PixelCNN++ recipe：reflect padding 4 + crop 32
      size: 32
      padding: 4
      padding_mode: reflect

train:
  amp_dtype: "bf16"
  batch_size: 64
  grad_accum_steps: 2
  lr: 3e-4
  eps: 1e-8
  epochs: 100
  log_freq: 50
  clip_max_norm: 1.0
  z_loss_weight: 1e-4
  lr_schedule: "cosine"
  warmup_epochs: 3
  swa:
    enabled: true
    start_epoch: 90
    update_interval: 1
  ema:
    enabled: true
    decay: 0.9995              # 100ep 长训，半衰期更长更稳

eval:
  interval: 2

checkpoint:
  save_interval: 5
