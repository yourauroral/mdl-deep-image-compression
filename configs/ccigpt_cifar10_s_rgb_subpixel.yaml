exp_name: "ccigpt_cifar10_s_rgb_subpixel"

# CC-iGPT RGB-bit-exact 真无损 + sub-pixel AR
# 与 ccigpt_cifar10_s_rgb.yaml 唯一差异：use_subpixel_ar=true
#
# 设计动机：
#   ccigpt_cifar10_s_rgb.yaml (channel-first) 实测 3.2540 bpd，远高于 PixelCNN++ 2.92。
#   诊断：channel-first 平铺下，预测 G_(i,j) 需要从 1024 token 远的 R 平面找 R_(i,j)，
#   注意力信噪比极低，模型难以学到通道耦合。
#
#   切到 pixel-first ([R0,G0,B0,R1,G1,B1,...]) 后，同一像素三通道相邻 (distance=1)，
#   注意力轻松学到 p(G|R), p(B|R,G)。等价于 PixelCNN++ §2.2 通道耦合的 token-AR 实现，
#   但避免 DMoL 输出头数值问题（已 revert）。
#
#   coarse 与 fine 共享 use_subpixel_ar；_compute_coarse_ctx 在入口/出口两处自动分支
#   保持 bit-exact 一致性（详见 cc_igpt.py 注释）。
#
# 同栈对比表：
#   ccigpt_cifar10_s_rgb.yaml          (channel-first, 50ep)   实测 3.2540
#   ccigpt_cifar10_s_rgb_subpixel.yaml (pixel-first,  50ep)    本配置，待实测
#   ccigpt_cifar10_s.yaml              (channel-first YCbCr-int, 120ep, ep20早停) 2.8047

model:
  type: ccigpt
  image_size: 32
  in_channels: 3
  vocab_size: 256
  pool_factor: 4               # 32 → 8（coarse 192 tokens, ~6% overhead）

  # fine 模型（与 iGPT-S 一致，~76M 参数）
  d_model: 512
  N: 24
  h: 8
  d_ff: 1376
  dropout: 0.0

  # coarse 模型（小且浅）
  coarse_d_model: 256
  coarse_N: 6
  coarse_h: 4
  coarse_d_ff: 688

  color_transform: "none"       # RGB-bit-exact 前端（真无损）
  use_subpixel_ar: true         # ★ pixel-first AR (coarse + fine 同步开启)
  activation_checkpointing: true   # fine N=24 必须开

data:
  dataset: "cifar10"
  train: datasets/
  valid: datasets/
  num_workers: 8

train:
  amp_dtype: "bf16"
  batch_size: 64
  grad_accum_steps: 2
  lr: 3e-4
  eps: 1e-8
  epochs: 50                    # 与 ccigpt_cifar10_s_rgb 训练预算对齐保证可比
  log_freq: 50
  clip_max_norm: 1.0
  z_loss_weight: 1e-4
  lr_schedule: "cosine"
  warmup_epochs: 3              # 6% epochs
  swa:
    enabled: true
    start_epoch: 45             # 最后 5 epoch 启动 SWA（90% epochs）
    update_interval: 1

eval:
  interval: 2

checkpoint:
  save_interval: 5
