exp_name: "ccigpt_imagenet64_v1"

# CC-iGPT RGB-bit-exact + sub-pixel AR + R-only coarse — ImageNet64 跨数据集首版
#
# 与 CIFAR-10 v2 (历史 ensemble+TTA 诊断 2.8296 bpd) 的差异：
#   数据：cifar10 (32×32×3, 50k train) → imagenet64_npy (64×64×3, 1.28M train)
#   image_size: 32 → 64，pool_factor=4 不变
#       → coarse  8×8 → 16×16   = 64 → 256 token  (R-only)
#       → fine   32×32×3 → 64×64×3 = 3072 → 12288 token  (×4)
#   显存：fine attention O(L²) 内存 ×16，必须降 batch
#       batch_size 48×3 → 12×6  (×4 卡 → effective batch 仍 288，见下方 grad_accum_steps)
#   epochs: 200 → 12 (ImageNet 1.28M / CIFAR 50k = 25.6×；12ep token 量 ≈ CIFAR 200ep × 1.5)
#       —— 实测 1.2s/micro-step × 53381 step/ep = 17.8 h/ep；
#       —— 12ep ≈ 8.9 天卡时（vs 40ep 30 天不可行）；
#       —— 训练 token 量约为 CIFAR v2 的 7.7×；旧 ensemble 预测仅作训练前记录。
#   SWA: start_epoch 170/200 → 11/12 (last 2 ckpts，update_interval=1，比例略低于 v2 85% 但 ImageNet 单 ep 信息量大)
#   EMA: decay 0.9998 → 0.9998 (12ep step ≈ 53k，半衰期 3.5k step ≈ 6.6% 总训，与 v2 同档)
#   warmup_epochs: 5 → 1 (12ep 太短，warmup 占比 < 1ep；step 数仍 4448 充裕)
#   hflip: True (ImageNet64Npy 已支持 W 轴翻转，对齐 v2 控制变量；预计 -0.01~-0.03 bpd)
#   ckpt save_start_epoch: 6 (ep1-5 不存；省 ~1.7GB 磁盘 + 加速早期 epoch end)
#
# 架构：fine N=32/d=448/h=7 (d_k=64), coarse 4.81M (256d×6L) — 与 v2 完全一致
#       (控制变量：纯换数据集；如 OOM 再考虑降 N/d 或 sparse-attn)
#
# 历史目标：bpd_total < 3.44；正式比较按单模型重评并记录实际数据文件 SHA-256。
#
# 风险：seq_len=12288 在 fp32 attention 下 batch=12 仍可能 OOM；
#       fallback: (a) batch 6 + accum 24 (b) activation_checkpointing 已开
#       (c) 降 N 32→24 + d 448→384 起步 (d) sparse-attn (future.md §6)
#
# 训练前预测 (2026-05-28, 12ep + hflip): best+TTA → 3.40-3.55；ensemble → 3.35-3.50。
# 决策点：ep12 ensemble bpd
#   < 3.42 → 历史决策记录；不得直接升级为正式主表
#   3.42-3.50 → warm restart 续训 4 ep（卡时 +3 天）
#   > 3.50 → debug（ctx α 是否收敛？lr 是否过低？）

model:
  type: ccigpt
  image_size: 64
  in_channels: 3
  vocab_size: 256
  pool_factor: 4

  # fine 模型（沿用 v2，~78.14M）
  d_model: 448
  N: 32
  h: 7
  d_ff: 1216
  dropout: 0.1
  drop_path: 0.1

  # coarse 模型（沿用 v2，~4.81M）
  coarse_d_model: 256
  coarse_N: 6
  coarse_h: 4
  coarse_d_ff: 688

  coarse_in_channels: 1         # R-only 灰度先验
  activation_checkpointing: true

data:
  dataset: "imagenet64_npy"
  train: /root/autodl-tmp/imagenet64_png
  valid: /root/autodl-tmp/imagenet64_png
  num_workers: 8
  valid_batch_size: 8
  valid_num_workers: 2
  augment:
    hflip: true                 # ImageNet64Npy 已支持 (W 轴翻转, train only)
    random_crop: null           # ImageNet64Npy 不支持 RandomCrop, 显式关

train:
  amp_dtype: "bf16"
  batch_size: 12                # 48 → 12 (seq ×4 → attention mem ×16)
  grad_accum_steps: 6           # 4 GPU × bs12 × accum6 = effective 288 不变（2→4 卡升级，2026-05-28）
  lr: 3e-4
  eps: 1e-8
  epochs: 12                    # 200 → 12 (1.2s/step × 53k step/ep = 17.8h/ep；12ep ≈ 8.9 天)
  log_freq: 50
  clip_max_norm: 1.0
  z_loss_weight: 1e-4
  lr_schedule: "cosine"
  warmup_epochs: 1              # 注：epoch 粒度 warmup，=1 时首 epoch 已是峰值 LR（无实际 warmup）；12ep 短训可接受，如需真 warmup 应改 step 粒度
  min_lr_ratio: 0.05
  swa:
    enabled: true
    start_epoch: 11             # last 2 ckpts (ep11..12, interval=1)
    update_interval: 1
  ema:
    enabled: true
    decay: 0.9998               # 12ep step ≈ 53k，半衰期 3.5k 与 v2 同档

eval:
  interval: 1                   # 12ep 数量少，每 ep 评一次（共 12 次）

checkpoint:
  save_interval: 1              # ep6 起每 ep 一存
  save_start_epoch: 6           # ep1-5 不存（warmup + 早期 cosine，ckpt 无价值）
