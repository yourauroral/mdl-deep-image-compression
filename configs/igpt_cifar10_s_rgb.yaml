exp_name: "igpt_cifar10_s_rgb"

# iGPT-S RGB-bit-exact baseline (单尺度自回归)
# 与 CC-iGPT 三档共用训练预算，作为单尺度对照。

model:
  type: igpt
  image_size: 32
  in_channels: 3
  vocab_size: 256
  d_model: 512
  N: 24
  h: 8
  d_ff: 1376
  dropout: 0.0
  use_subpixel_ar: true
  activation_checkpointing: true

data:
  dataset: "cifar10"
  train: datasets/
  valid: datasets/
  num_workers: 8

train:
  amp_dtype: "bf16"
  batch_size: 64
  grad_accum_steps: 2
  lr: 3e-4
  eps: 1e-8
  epochs: 50
  log_freq: 50
  clip_max_norm: 1.0
  z_loss_weight: 1e-4
  lr_schedule: "cosine"
  warmup_epochs: 3
  swa:
    enabled: true
    start_epoch: 45
    update_interval: 1

eval:
  interval: 2

checkpoint:
  save_interval: 5
